<!DOCTYPE html>
<html lang="en" translate="no">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Book an Appointment — Nunnas ESL</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,700;1,400;1,700&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
<style>
:root{
  --navy:#2d3561;--navy2:#3d4878;
  --teal:#00cec9;--teal2:#00b5b0;--tealp:#e0fafa;
  --green:#00b894;--greenp:#e6faf5;--greend:#007a63;
  --coral:#e17055;--coralp:#fff0ed;--corald:#a84f20;
  --amber:#f9a825;--amberp:#fff8e6;
  --purple:#a29bfe;--purplep:#eeeeff;--purpled:#6c5ce7;
  --text:#2d2d2d;--muted:#6b7280;
  --border:#e5e7f0;--bg:#f5f6ff;--rad:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

/* ── HERO ── */
.hero{background:linear-gradient(135deg,var(--navy) 0%,var(--navy2) 50%,#4a5490 100%);padding:2.5rem 1.25rem 5rem;position:relative;overflow:hidden;text-align:center}
.hc1{position:absolute;width:300px;height:300px;border-radius:50%;background:var(--teal);opacity:.12;filter:blur(60px);top:-80px;left:-60px}
.hc2{position:absolute;width:250px;height:250px;border-radius:50%;background:var(--purple);opacity:.15;filter:blur(60px);bottom:-60px;right:-40px}
.logo-badge{display:inline-block;background:white;border-radius:12px;padding:8px 20px;font-family:'Lora',serif;font-weight:700;color:var(--navy);font-size:1rem;margin-bottom:1rem;position:relative;z-index:2;cursor:pointer;user-select:none}
.hero h1{font-family:'Lora',serif;font-size:2.2rem;font-weight:700;color:white;position:relative;z-index:2;line-height:1.2}
.hero h1 em{color:var(--teal);font-style:italic}
.hero p{color:rgba(255,255,255,.8);margin-top:.5rem;font-size:.95rem;position:relative;z-index:2}
.hero-mode{display:inline-block;margin-top:.75rem;font-size:.75rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--teal);position:relative;z-index:2}

/* ── WRAP ── */
.wrap{max-width:760px;margin:-2.5rem auto 0;padding:0 1.25rem 4rem;position:relative;z-index:10}
.card{background:white;border-radius:var(--rad);border:2px solid var(--border);box-shadow:0 4px 24px rgba(45,53,97,.10);padding:1.5rem;margin-bottom:1.25rem}
.card-title{font-family:'Lora',serif;font-size:1.15rem;font-weight:700;color:var(--navy);margin-bottom:1rem;display:flex;align-items:center;gap:.5rem}
.step-label{font-size:.72rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--teal2);margin-bottom:.4rem}

/* ── TEACHER PANEL (admin) ── */
.tpanel{background:#1e2340;border-radius:var(--rad);border:2px solid #3d4878;box-shadow:0 4px 24px rgba(0,0,0,.3);padding:1.5rem;margin-bottom:1.25rem}
.tpanel-title{font-family:'Lora',serif;color:white;font-size:1.1rem;margin-bottom:.25rem}
.tpanel-sub{color:rgba(255,255,255,.5);font-size:.82rem;margin-bottom:1.25rem}
.sbox{background:#161930;border-radius:10px;padding:1.1rem;margin-bottom:1rem}
.sbox-lbl{color:var(--teal);font-size:.75rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;margin-bottom:.5rem}
.sbox p{color:rgba(255,255,255,.5);font-size:.8rem;line-height:1.6;margin-bottom:.75rem}
.sbox input[type=file]{color:rgba(255,255,255,.7);font-size:.85rem;width:100%}
.sstat{font-size:.8rem;margin-top:.5rem;color:rgba(255,255,255,.4)}
.sstat.ok{color:var(--teal)}.sstat.err{color:var(--coral)}

/* steps inside teacher panel */
.tsteps{margin-bottom:1rem}
.tstep{display:flex;gap:.6rem;align-items:flex-start;margin-bottom:.5rem}
.tsn{width:22px;height:22px;border-radius:50%;background:#3d4878;color:var(--teal);font-weight:900;font-size:.72rem;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.tst{font-size:.82rem;color:rgba(255,255,255,.65);line-height:1.5}
code{background:rgba(255,255,255,.1);padding:1px 6px;border-radius:4px;font-size:.78rem;color:var(--teal);font-weight:700}

/* teacher preview table */
.t-preview{margin:1rem 0;display:none}
.t-preview-title{color:var(--teal);font-size:.75rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;margin-bottom:.6rem}
.t-cards{display:flex;flex-wrap:wrap;gap:.6rem}
.t-chip{background:#2d3561;border:1px solid #3d4878;border-radius:10px;padding:.5rem .9rem;display:flex;align-items:center;gap:.6rem}
.t-chip img,.t-chip-av{width:32px;height:32px;border-radius:50%;object-fit:cover;flex-shrink:0}
.t-chip-av{background:var(--navy2);color:var(--teal);font-family:'Lora',serif;font-weight:700;font-size:.9rem;display:flex;align-items:center;justify-content:center}
.t-chip-name{color:white;font-weight:800;font-size:.82rem}
.t-chip-subj{color:rgba(255,255,255,.45);font-size:.72rem}
.t-chip-del{background:none;border:none;color:rgba(255,255,255,.3);cursor:pointer;font-size:1rem;margin-left:.25rem;transition:color .15s}
.t-chip-del:hover{color:var(--coral)}

/* generate button */
.btn-gen{width:100%;padding:13px;border-radius:10px;border:none;background:var(--teal);color:#1e2340;font-family:'Lora',serif;font-size:1rem;font-weight:700;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:.5rem;margin-top:.75rem}
.btn-gen:hover{background:var(--teal2);transform:translateY(-1px)}
.btn-gen:disabled{opacity:.4;cursor:not-allowed;transform:none}
.gen-out{margin-top:1rem;display:none}
.gen-out-lbl{color:var(--teal);font-size:.75rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;margin-bottom:.4rem}
.link-row{display:flex;gap:.5rem}
.link-row input{flex:1;padding:9px 12px;border-radius:8px;border:2px solid #3d4878;background:#2d3561;color:white;font-family:'Nunito',sans-serif;font-size:.78rem;outline:none}
.copy-btn{padding:9px 16px;border-radius:8px;border:none;background:var(--green);color:white;font-family:'Nunito',sans-serif;font-weight:800;cursor:pointer;font-size:.82rem;white-space:nowrap;transition:background .15s}
.copy-btn:hover{background:var(--greend)}
.copy-ok{color:var(--teal);font-size:.78rem;margin-top:.35rem;display:none;font-weight:700}

/* ── STUDENT VIEW ── */
.how-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.75rem;margin-top:.25rem}
.how-item{background:var(--bg);border-radius:12px;border:2px solid var(--border);padding:1rem;text-align:center}
.how-icon{font-size:1.5rem;margin-bottom:.35rem}
.how-item h3{font-size:.82rem;font-weight:800;color:var(--navy);margin-bottom:.15rem}
.how-item p{font-size:.73rem;color:var(--muted);line-height:1.5}

.teacher-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.75rem}
.teacher-card{border:2px solid var(--border);border-radius:14px;padding:1.1rem;text-align:center;cursor:pointer;transition:all .2s;background:white}
.teacher-card:hover{border-color:var(--teal);transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,206,201,.15)}
.teacher-card.selected{border-color:var(--teal);background:var(--tealp);box-shadow:0 0 0 3px rgba(0,206,201,.2)}
.teacher-card img,.tc-av{width:56px;height:56px;border-radius:50%;object-fit:cover;margin:0 auto .6rem;display:block;border:2px solid var(--border)}
.tc-av{background:var(--navy);color:var(--teal);font-family:'Lora',serif;font-weight:700;font-size:1.3rem;display:flex;align-items:center;justify-content:center}
.tc-name{font-weight:800;font-size:.9rem;color:var(--navy)}
.tc-subj{font-size:.75rem;color:var(--muted);margin-top:.15rem}

.book-panel{background:linear-gradient(135deg,#1e2340,#2d3561);border-radius:14px;padding:1.5rem;text-align:center}
.book-panel p{color:rgba(255,255,255,.75);font-size:.9rem;margin-bottom:1.25rem;line-height:1.7}
.book-panel strong{color:white}
.btn-cal{display:inline-flex;align-items:center;gap:.6rem;padding:13px 28px;background:var(--teal);color:#1e2340;border:none;border-radius:30px;font-family:'Lora',serif;font-size:1rem;font-weight:700;cursor:pointer;text-decoration:none;transition:all .2s;box-shadow:0 4px 15px rgba(0,206,201,.3)}
.btn-cal:hover{background:var(--teal2);transform:translateY(-2px)}
.divider{display:flex;align-items:center;gap:.75rem;margin:1.1rem 0;color:rgba(255,255,255,.25);font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:rgba(255,255,255,.1)}
.chips{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center}
.chip{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:4px 13px;font-size:.75rem;color:rgba(255,255,255,.65);font-weight:700}

/* no-data */
.no-data{text-align:center;padding:2.5rem 1rem}
.no-data .icon{font-size:2.5rem;margin-bottom:.75rem}
.no-data h2{font-family:'Lora',serif;color:var(--navy);margin-bottom:.4rem}
.no-data p{color:var(--muted);font-size:.88rem;line-height:1.6}

/* alerts */
.alert{border-radius:10px;padding:.8rem 1rem;font-size:.85rem;font-weight:700;margin-bottom:.75rem;display:none}
.alert-ok{background:var(--greenp);color:var(--greend);border:2px solid var(--green)}
.alert-err{background:var(--coralp);color:var(--corald);border:2px solid var(--coral)}

.hidden{display:none!important}
@media(max-width:480px){
  .hero h1{font-size:1.7rem}
  .how-grid{grid-template-columns:1fr}
  .link-row{flex-direction:column}
}
</style>
</head>
<body>

<div class="hero">
  <div class="hc1"></div><div class="hc2"></div>
  <div class="logo-badge" id="logoBadge" onclick="toggleMode()">🇬🇧 Nunnas ESL</div>
  <h1>Book an <em>Appointment</em></h1>
  <p id="heroSub">Choose your teacher and pick a time that works for you</p>
  <div class="hero-mode" id="heroMode"></div>
</div>

<div class="wrap" id="mainWrap"></div>

<script>
// ─────────────────────────────────────────────
// MODE — 'teacher' or 'student'
// teacher mode = URL has ?mode=teacher  OR no ?teachers= param
// student mode = URL has ?teachers= param
// Logo click always toggles to teacher view
// ─────────────────────────────────────────────
var MODE = 'student';
var _teachers = [];

function getParam(k){ return new URLSearchParams(window.location.search).get(k); }

function init(){
  var tParam = getParam('teachers');
  var mParam = getParam('mode');
  if(mParam === 'teacher' || !tParam){ MODE = 'teacher'; }
  else { MODE = 'student'; }
  render();
}

function toggleMode(){
  MODE = (MODE === 'student') ? 'teacher' : 'student';
  render();
}

function render(){
  if(MODE === 'teacher') renderTeacher();
  else renderStudent();
}

// ─────────────────────────────────────────────
// TEACHER / ADMIN VIEW
// ─────────────────────────────────────────────
function renderTeacher(){
  document.getElementById('heroSub').textContent = 'Admin Panel — manage teachers & generate student link';
  document.getElementById('heroMode').textContent = '⚙️ Teacher Admin Mode';
  document.getElementById('mainWrap').innerHTML = `
    <div class="tpanel" id="tpanel">
      <div class="tpanel-title">⚙️ Teacher Setup</div>
      <div class="tpanel-sub">Upload a CSV from Google Sheets to load your teacher list, then generate a student booking link.</div>

      <div class="tsteps">
        <div class="tstep"><div class="tsn">1</div><div class="tst">In Google Sheets, create columns: <code>name</code> <code>subject</code> <code>photo</code> <code>bookingUrl</code></div></div>
        <div class="tstep"><div class="tsn">2</div><div class="tst">The <code>photo</code> column should be a direct image URL. For Google Drive: right-click image → Get link, change <code>/view</code> to <code>/uc?export=view</code>. Leave blank for initials.</div></div>
        <div class="tstep"><div class="tsn">3</div><div class="tst">Go to <strong style="color:white">File → Download → CSV</strong> and save the file.</div></div>
        <div class="tstep"><div class="tsn">4</div><div class="tst">Upload the CSV below, check the preview, then click <strong style="color:white">Generate Student Link</strong>.</div></div>
      </div>

      <div class="sbox">
        <div class="sbox-lbl">📤 Upload Teacher CSV</div>
        <input type="file" id="csvFile" accept=".csv"/>
        <div class="sstat" id="csvStat">No file loaded</div>
      </div>

      <div class="alert alert-ok" id="alertOk"></div>
      <div class="alert alert-err" id="alertErr"></div>

      <div class="t-preview" id="tPreview">
        <div class="t-preview-title">👥 Loaded Teachers</div>
        <div class="t-cards" id="tCards"></div>
      </div>

      <button class="btn-gen" id="genBtn" onclick="generateLink()" disabled>✨ Generate Student Booking Link</button>

      <div class="gen-out" id="genOut">
        <div class="gen-out-lbl">📎 Student booking link — share this!</div>
        <div class="link-row">
          <input type="text" id="genLink" readonly/>
          <button class="copy-btn" onclick="copyLink()">Copy</button>
        </div>
        <div class="copy-ok" id="copyOk">✅ Copied to clipboard!</div>
      </div>
    </div>
  `;
  document.getElementById('csvFile').addEventListener('change', handleCSV);
}

// ─── CSV PARSING ───────────────────────────────
function handleCSV(e){
  var file = e.target.files[0]; if(!file) return;
  var stat = document.getElementById('csvStat');
  stat.textContent = 'Reading ' + file.name + '…'; stat.className = 'sstat';
  var r = new FileReader();
  r.onload = function(ev){ parseCSV(ev.target.result, file.name); };
  r.onerror = function(){ showAlert('alertErr','Could not read file.'); };
  r.readAsText(file);
}

function parseCSV(text, fname){
  var lines = text.trim().split(/\r?\n/);
  if(lines.length < 2){ showAlert('alertErr','CSV needs a header row and at least one teacher.'); return; }
  var headers = splitLine(lines[0]).map(function(h){ return h.toLowerCase().trim(); });
  var iN = headers.indexOf('name'), iS = headers.indexOf('subject'),
      iP = headers.indexOf('photo'), iU = headers.indexOf('bookingurl');
  if(iN < 0 || iU < 0){ showAlert('alertErr','CSV must have <strong>name</strong> and <strong>bookingUrl</strong> columns.'); return; }
  var parsed = [];
  for(var i=1;i<lines.length;i++){
    var c = splitLine(lines[i]);
    var n = (c[iN]||'').trim(); if(!n) continue;
    parsed.push({ name:n, subject:(iS>=0?(c[iS]||''):'').trim(), photo:(iP>=0?(c[iP]||''):'').trim(), bookingUrl:(iU>=0?(c[iU]||''):'').trim() });
  }
  if(!parsed.length){ showAlert('alertErr','No valid rows found.'); return; }
  _teachers = parsed;
  document.getElementById('csvStat').textContent = '✓ ' + fname; document.getElementById('csvStat').className = 'sstat ok';
  showAlert('alertOk','✅ ' + parsed.length + ' teacher' + (parsed.length>1?'s':'') + ' loaded!');
  hideAlert('alertErr');
  renderChips();
  document.getElementById('genBtn').disabled = false;
  document.getElementById('genOut').style.display = 'none';
}

function splitLine(line){
  var res=[],cur='',inQ=false;
  for(var i=0;i<line.length;i++){
    var c=line[i];
    if(c==='"'){inQ=!inQ;}
    else if(c===','&&!inQ){res.push(cur);cur='';}
    else{cur+=c;}
  }
  res.push(cur); return res;
}

function renderChips(){
  var el = document.getElementById('tPreview'); el.style.display='block';
  document.getElementById('tCards').innerHTML = _teachers.map(function(t,i){
    var av = t.photo
      ? '<img src="'+esc(t.photo)+'" onerror="this.style.display=\'none\';this.nextSibling.style.display=\'flex\'">'
        +'<div class="t-chip-av" style="display:none">'+ini(t.name)+'</div>'
      : '<div class="t-chip-av">'+ini(t.name)+'</div>';
    return '<div class="t-chip" id="chip'+i+'">'
      +av+'<div><div class="t-chip-name">'+esc(t.name)+'</div><div class="t-chip-subj">'+esc(t.subject||'')+'</div></div>'
      +'<button class="t-chip-del" onclick="removeT('+i+')" title="Remove">✕</button></div>';
  }).join('');
}

function removeT(i){
  _teachers.splice(i,1);
  if(!_teachers.length){ document.getElementById('tPreview').style.display='none'; document.getElementById('genBtn').disabled=true; document.getElementById('genOut').style.display='none'; }
  else renderChips();
}

// ─── GENERATE LINK ────────────────────────────
function generateLink(){
  if(!_teachers.length) return;
  var data = btoa(unescape(encodeURIComponent(JSON.stringify(_teachers))));
  var url = window.location.href.split('?')[0] + '?teachers=' + data;
  document.getElementById('genLink').value = url;
  document.getElementById('genOut').style.display = 'block';
  document.getElementById('copyOk').style.display = 'none';
  document.getElementById('genOut').scrollIntoView({behavior:'smooth',block:'center'});
}

function copyLink(){
  var inp = document.getElementById('genLink');
  inp.select(); inp.setSelectionRange(0,99999);
  navigator.clipboard.writeText(inp.value).then(function(){
    var el=document.getElementById('copyOk'); el.style.display='block';
    setTimeout(function(){el.style.display='none';},2500);
  }).catch(function(){ document.execCommand('copy'); document.getElementById('copyOk').style.display='block'; });
}

// ─────────────────────────────────────────────
// STUDENT VIEW
// ─────────────────────────────────────────────
function renderStudent(){
  document.getElementById('heroSub').textContent = 'Choose your teacher and pick a time that works for you';
  document.getElementById('heroMode').textContent = '';
  var teachers = [];
  try{
    var raw = getParam('teachers');
    if(raw) teachers = JSON.parse(decodeURIComponent(escape(atob(raw))));
  } catch(e){}

  var wrap = document.getElementById('mainWrap');

  if(!teachers.length){
    wrap.innerHTML = `
      <div class="card">
        <div class="no-data">
          <div class="icon">🔗</div>
          <h2>No booking link found</h2>
          <p>Please use the link provided by your teacher.<br/>Contact your teacher if you need a new link.</p>
        </div>
      </div>`;
    return;
  }

  wrap.innerHTML = `
    <div class="card">
      <div class="card-title"><span>✨</span> How it works</div>
      <div class="how-grid">
        <div class="how-item"><div class="how-icon">👤</div><h3>Choose a teacher</h3><p>Select who you'd like to meet</p></div>
        <div class="how-item"><div class="how-icon">📅</div><h3>Pick a slot</h3><p>Only real available times shown</p></div>
        <div class="how-item"><div class="how-icon">✉️</div><h3>Get confirmed</h3><p>Calendar invite sent to your email</p></div>
      </div>
    </div>
    <div class="card">
      <div class="step-label">Step 1</div>
      <div class="card-title"><span>👤</span> Who would you like to see?</div>
      <div class="teacher-grid" id="teacherGrid"></div>
    </div>
    <div class="card hidden" id="bookCard">
      <div class="step-label">Step 2</div>
      <div class="card-title"><span>📅</span> <span id="bookHeading">Book your session</span></div>
      <div class="book-panel">
        <p id="bookDesc"></p>
        <a id="bookLink" href="#" target="_blank" class="btn-cal">📅 &nbsp;Open Booking Calendar</a>
        <div class="divider">what to expect</div>
        <div class="chips">
          <div class="chip">✅ Only available slots</div>
          <div class="chip">⚡ Updates in real time</div>
          <div class="chip">✉️ Invite by email</div>
        </div>
      </div>
    </div>`;

  var grid = document.getElementById('teacherGrid');
  teachers.forEach(function(t,i){
    var av = t.photo
      ? '<img src="'+esc(t.photo)+'" onerror="this.style.display=\'none\';this.nextSibling.style.display=\'flex\'">'
        +'<div class="tc-av" style="display:none">'+ini(t.name)+'</div>'
      : '<div class="tc-av">'+ini(t.name)+'</div>';
    var card = document.createElement('div');
    card.className = 'teacher-card';
    card.innerHTML = av+'<div class="tc-name">'+esc(t.name)+'</div><div class="tc-subj">'+esc(t.subject||'')+'</div>';
    card.onclick = (function(teacher){ return function(){ selectTeacher(teacher,card); }; })(t);
    grid.appendChild(card);
  });
}

function selectTeacher(t, card){
  document.querySelectorAll('.teacher-card').forEach(function(c){c.classList.remove('selected');});
  card.classList.add('selected');
  document.getElementById('bookHeading').textContent = 'Book with ' + t.name;
  document.getElementById('bookDesc').innerHTML =
    'You\'re booking a <strong>'+(t.subject||'session')+'</strong> session with <strong>'+esc(t.name)+'</strong>.<br/>Click below — only your teacher\'s available slots are shown.';
  document.getElementById('bookLink').href = t.bookingUrl || '#';
  var bc = document.getElementById('bookCard');
  bc.classList.remove('hidden');
  setTimeout(function(){bc.scrollIntoView({behavior:'smooth',block:'start'});},100);
}

// ─────────────────────────────────────────────
// HELPERS
// ─────────────────────────────────────────────
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function ini(n){ return (n||'?')[0].toUpperCase(); }
function showAlert(id,msg){ var e=document.getElementById(id); e.innerHTML=msg; e.style.display='block'; }
function hideAlert(id){ document.getElementById(id).style.display='none'; }

init();
</script>
</body>
</html>
